[project]
name = "scripts-quick"
version = "0.1.0"
description = "Create a small Python, Node, C++, or empty project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12.3"]

[project.scripts]
quick = "scripts_quick:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scripts_quick"]
