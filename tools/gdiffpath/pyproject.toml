[project]
name = "scripts-gdiffpath"
version = "0.1.0"
description = "List modified non-binary Git paths."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12.3"]

[project.scripts]
gdiffpath = "scripts_gdiffpath:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scripts_gdiffpath"]
