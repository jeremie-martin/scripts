[project]
name = "scripts-agent-export"
version = "0.1.0"
description = "Export visible Claude and Codex conversations from local session logs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12.3"]

[project.scripts]
agent-export = "scripts_agent_export:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scripts_agent_export"]
