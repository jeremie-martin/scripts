[project]
name = "scripts-clipboard"
version = "0.1.0"
description = "Desktop clipboard transport for the personal command-line tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyperclip>=1.9.0"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scripts_clipboard"]
