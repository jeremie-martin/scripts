[project]
name = "scripts"
description = "Utility scripts for development and automation"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "pyperclip>=1.9.0",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "yt-dlp>=2025.8.27",
]

[project.optional-dependencies]
# Keep base install light; opt into features as needed
jama = ["py-jama-rest-client>=1.17.1", "beautifulsoup4>=4.12.3"]
media = [
  "youtube-transcript-api>=1.2.2",
  # keep flexible, yt-dlp updates frequently
  "yt-dlp>=2024.10.0",
]
dev = ["ruff>=0.12.9"]

[project.scripts]
# keep direct commands for muscle memory
concat = "scripts.concat:main"
transcript = "scripts.transcript:main"
ffcut = "scripts.ffcut:main"
gdiffpath = "scripts.git_tools:main"
import-photos = "scripts.import_photos:main"
# jama tools (stay discrete *and* available via `scripts jama …`)
jamaclean = "scripts.jamaclean:main"
jamaconcat = "scripts.jamaconcat:main"
jamaconcatfull = "scripts.jamaconcatfull:main"
jamafilltests = "scripts.jamafilltests:main"
jamalinking = "scripts.jamalinking:main"
jamalinkingfull = "scripts.jamalinkingfull:main"
jamanotest = "scripts.jamanotest:main"
jamatmp = "scripts.jamatmp:main"
# image tools
2twi = "scripts.img_tools:cmd_2twi"
2work = "scripts.img_tools:cmd_2work"
# Windows-friendly aliases (optional)
img-twi = "scripts.img_tools:cmd_2twi"
img-work = "scripts.img_tools:cmd_2work"
# umbrella CLI
scripts = "scripts.cli:app"

[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scripts*"]

[tool.setuptools_scm]
write_to = "src/scripts/__version__.py"

# ---- Tooling configs ----
[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []
